<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Shopping demo · FluxA</title>
  <link rel="stylesheet" href="./demo.css">
  <script type="module" src="./demo.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-content">
      <div class="brand"><span class="brand-icon" aria-hidden="true"></span>FluxA</div>
      <button id="connection" class="button secondary connection" type="button">Connect service</button>
    </div>
  </header>

  <main class="shell">
    <h1>Shopping demo</h1>

    <div class="workspace">
      <section class="panel" aria-labelledby="search-title">
        <h2 id="search-title">Find a product</h2>
        <form id="search" class="stack">
          <label class="visually-hidden" for="query">Product name or URL</label>
          <div class="search-box">
            <input id="query" placeholder="Product name or URL" maxlength="2048" required>
            <button id="search-button" class="button primary" type="submit">Search</button>
          </div>
          <div class="market">
            <label for="country">Ship to</label>
            <input id="country" aria-label="Ship to country code" value="US" minlength="2" maxlength="2" pattern="[a-zA-Z]{2}" size="2" required spellcheck="false" autocapitalize="characters">
            <label for="currency">Currency</label>
            <input id="currency" value="USD" minlength="3" maxlength="3" pattern="[a-zA-Z]{3}" size="3" required spellcheck="false" autocapitalize="characters">
          </div>
        </form>
        <p id="search-note" class="muted" role="status" hidden></p>
        <div id="results" class="results"></div>

        <details>
          <summary>Test products</summary>
          <form id="fixtures" class="fixture-row" hidden>
            <label class="visually-hidden" for="fixture">Test product</label>
            <select id="fixture" required></select>
            <button id="fixture-add" class="button secondary" type="submit">Add to cart</button>
          </form>
          <details class="manual-entry">
            <summary>Enter a variant ID</summary>
            <form id="manual" class="stack">
              <div class="field-row">
                <label>Merchant domain<input id="merchant" list="merchant-list" placeholder="store.myshopify.com" required autocomplete="off" spellcheck="false"></label>
                <datalist id="merchant-list"></datalist>
                <label>Variant ID<input id="variant" placeholder="Shopify variant ID or GID" required autocomplete="off" spellcheck="false"></label>
              </div>
              <button id="manual-add" class="button secondary start" type="submit">Add variant</button>
            </form>
          </details>
        </details>
      </section>

      <section class="panel" aria-labelledby="cart-title">
        <div class="section-heading">
          <h2 id="cart-title">Cart</h2>
          <span id="cart-count" class="count" role="status" hidden></span>
        </div>
        <p id="cart-empty" class="muted">Your cart is empty.</p>
        <ul id="cart-items" class="cart-items"></ul>
        <p id="cart-merchant" class="muted" hidden></p>
        <p id="selection-note" class="notice" role="status" hidden></p>
        <div id="delivery" class="stack"></div>
        <p id="purchase-status" class="status" role="status" hidden></p>
        <p id="checkout-note" class="muted" role="status" hidden></p>
        <dl id="quote-totals" class="totals" hidden></dl>
        <ul id="quote-messages" class="quote-details muted" aria-label="Merchant checkout messages" hidden></ul>
        <ul id="quote-links" class="quote-details muted" aria-label="Merchant policies" hidden></ul>
        <p id="quote-expiry" class="muted" hidden></p>
        <dl id="receipt" class="receipt" hidden></dl>
        <button id="quote-button" class="button primary full" type="button" hidden disabled>Get quote</button>
        <a id="merchant-checkout" class="button primary full" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" hidden>Continue to Shopify checkout</a>
        <button id="review-button" class="button primary full" type="button" hidden>Review order</button>
        <p id="purchase-error" class="notice" role="alert" hidden></p>
        <div class="actions">
          <button id="refresh-button" class="text-button" type="button" hidden>Refresh status</button>
          <button id="new-cart" class="text-button" type="button" hidden>Start a new cart</button>
        </div>
        <details id="activity" hidden>
          <summary>Purchase activity</summary>
          <p id="purchase-reference" class="muted"></p>
          <ol id="events" class="events"></ol>
        </details>
      </section>
    </div>
  </main>

  <dialog id="connect-dialog" aria-labelledby="connect-title">
    <form id="connect-form" class="stack" autocomplete="off">
      <h2 id="connect-title">Connect to the checkout service</h2>
      <label>Service token<input id="token" type="password" required autofocus autocomplete="off" spellcheck="false"></label>
      <p id="connect-error" class="notice" role="alert" hidden></p>
      <div class="dialog-actions">
        <button id="connect-cancel" class="button secondary" type="button">Cancel</button>
        <button id="connect-submit" class="button primary" type="submit">Connect</button>
      </div>
    </form>
  </dialog>

  <dialog id="approve-dialog" aria-labelledby="approve-title">
    <form id="approve-form" class="stack">
      <h2 id="approve-title">Approve this test order</h2>
      <p id="approve-summary" class="muted"></p>
      <div id="approve-amount" class="approve-amount"></div>
      <label id="payment-method-field" hidden>Payment method<select id="payment-method"></select></label>
      <div class="dialog-actions">
        <button id="approve-cancel" class="button secondary" type="button" autofocus>Back</button>
        <button id="approve-submit" class="button primary" type="submit">Approve &amp; place test order</button>
      </div>
    </form>
  </dialog>
</body>
</html>
